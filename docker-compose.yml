services:
  moderation:
    build:
      context: .
      dockerfile: Dockerfile
    image: spam-moderation-console:1.0.0
    container_name: spam-moderation
    ports:
      - "8000:8000"
    environment:
      MODEL_DIR: /srv/models
      DEFAULT_MODEL_VERSION: v1
      MAX_BATCH_SIZE: "4"
      BATCH_WAIT_MS: "200"
      DISPATCH_GUARD_MS: "25"
      MAX_EMAILS_PER_SUBMISSION: "16"
      LOG_LEVEL: INFO
    volumes:
      # Two distinct English bag-of-words models are baked into the image.
      # The host directory is mounted read-write (not read-only) so on-call
      # operators can repair a corrupt artifact in place and trigger
      # "重试加载" in the web console without restarting the service.  The
      # baked-in copy under /srv/models still serves as the build-time
      # fallback; never edit files inside the container image itself.
      - ./models:/srv/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Single worker: inference is CPU-bound and cheap (bag-of-words dot
    # product), and the scheduler/version pointer must stay in one process.
    deploy:
      replicas: 1
    stop_grace_period: 15s
